<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d2a20">
<title>Route</title>
<style>
  @font-face { font-family: 'Iosevka'; font-weight: 300; src: url('/fonts/iosevka-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka'; font-weight: 400; src: url('/fonts/iosevka-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka'; font-weight: 500; src: url('/fonts/iosevka-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka Aile'; font-weight: 400; src: url('/fonts/iosevka-aile-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka Aile'; font-weight: 500; src: url('/fonts/iosevka-aile-latin-500-normal.woff2') format('woff2'); }

  /* The route you picked on the TV, on your phone: the forest behind clear
     glass, like the launcher. Everything it shows travels in the address
     after the #, so it never reaches a server. */
  :root {
    --text: #fff; --muted: rgba(255,255,255,0.72); --faint: rgba(255,255,255,0.5);
    --warn: #FFC066;
    --glass-fill: rgba(18, 18, 18, 0.2);
    --glass-edge: rgba(255, 255, 255, 0.16);
    --glass-blur: blur(16px) saturate(160%);
    --lift: 0 1px 2px rgba(0,0,0,0.16), 0 18px 40px -16px rgba(0,0,0,0.45);
    --mono: 'Iosevka', ui-monospace, monospace;
    --settle: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--text); background: #1d2a20; font: 16px/1.45 'Iosevka Aile', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  .bg { position: fixed; inset: 0; background: url('/docs/forest.jpg') 50% 40% / cover no-repeat; }
  .bg::after { content: ''; position: absolute; inset: 0;
               background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.35) 100%); }
  .glass { background: var(--glass-fill); border-radius: 24px;
           box-shadow: inset 0 0 0 1px var(--glass-edge), inset 0 1px 0 rgba(255,255,255,0.1), var(--lift);
           -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
  main { position: relative; max-width: 560px; margin: 0 auto;
         padding: calc(env(safe-area-inset-top) + 8vh) 20px calc(env(safe-area-inset-bottom) + 32px);
         display: flex; flex-direction: column; gap: 18px; animation: rise 0.7s var(--settle) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .label { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 2px 0 0; font: 300 64px/1 var(--mono); letter-spacing: -0.03em; }
  h1 small { font-family: 'Iosevka Aile', sans-serif; font-size: 20px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-right: 10px; }
  .summary { font-size: 17px; color: var(--muted); }
  .summary b { color: var(--text); font-weight: 500; }
  .countdown { font: 14px var(--mono); color: var(--faint); }
  .late { color: var(--warn); }

  .steps { padding: 8px 18px; }
  .step { display: grid; grid-template-columns: 54px 22px 1fr; gap: 0 10px; padding: 12px 0; }
  .step + .step { border-top: 1px solid rgba(255,255,255,0.08); }
  .step .t { font: 500 15px var(--mono); padding-top: 1px; }
  .step .dot { position: relative; }
  .step .dot::before { content: ''; position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .step.walk .dot::before { background: transparent; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6); }
  .step .what { font-size: 16px; }
  .step .what .line { display: inline-block; font: 500 13px var(--mono); padding: 2px 7px; border-radius: 6px; margin-right: 6px;
                      background: rgba(255,255,255,0.9); color: #111; vertical-align: 1px; }
  .step .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 13px 15px; min-height: 58px; border-radius: 18px; color: var(--text);
         text-decoration: none; font-weight: 500; transition: transform 0.2s var(--settle); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: #fff; color: #111; box-shadow: var(--lift); }
  .btn .note { font-weight: 400; font-size: 13px; opacity: 0.6; }
  .empty { margin-top: 30vh; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main id="main"></main>

<script>
(function () {
  'use strict';
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(d) { d = new Date(d); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function dur(min) { return min >= 60 ? Math.floor(min / 60) + ' h ' + (min % 60) + ' min' : min + ' min'; }
  var VEHICLE = {train: 'Train', subway: 'Metro', metro: 'Metro', bus: 'Bus', tram: 'Tram', ferry: 'Ferry'};

  var main = document.getElementById('main');
  var trip = null;
  try {
    var b64 = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    trip = JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch (e) { trip = null; }
  if (!trip || !trip.o) { main.appendChild(el('div', 'empty', 'No route in this link.')); return; }
  var o = trip.o;
  document.title = 'Leave ' + hhmm(o.l);

  var when = new Date(trip.s);
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var day = Math.round((new Date(when).setHours(0, 0, 0, 0) - today) / 86400000);
  var dayLabel = day === 0 ? 'Today' : day === 1 ? 'Tomorrow' : when.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'short'});
  main.appendChild(el('div', 'label', dayLabel + ' · ' + (trip.e || 'Trip')));
  var h = el('h1');
  h.appendChild(el('small', null, 'Leave'));
  h.appendChild(document.createTextNode(hhmm(o.l)));
  main.appendChild(h);
  var sum = el('div', 'summary');
  sum.innerHTML = '';
  sum.appendChild(document.createTextNode('Arrive '));
  sum.appendChild(el('b', null, hhmm(o.a)));
  sum.appendChild(document.createTextNode(' · ' + dur(o.d) + (o.x ? ' · ' + o.x + (o.x === 1 ? ' transfer' : ' transfers') : '') + (trip.loc ? ' · ' + trip.loc : '')));
  main.appendChild(sum);
  var cd = el('div', 'countdown');
  main.appendChild(cd);
  function tick() {
    var m = Math.round((Date.parse(o.l) - Date.now()) / 60000);
    cd.textContent = m > 0 ? 'Leave in ' + dur(m) : m > -5 ? 'Leave now' : 'Departed';
    cd.classList.toggle('late', m <= 5 && m > -5);
  }
  tick(); setInterval(tick, 30000);

  // The steps, each with the time it starts: walks run from the end of what came before.
  var steps = el('div', 'steps glass');
  var clock = Date.parse(o.l);
  (o.legs || []).forEach(function (leg, i) {
    var s = el('div', 'step' + (leg.w != null ? ' walk' : ''));
    if (leg.w != null) {
      s.appendChild(el('div', 't', hhmm(clock)));
      s.appendChild(el('div', 'dot'));
      var w = el('div', 'what', 'Walk ' + leg.w + ' min');
      var target = leg.to || (i === o.legs.length - 1 ? trip.loc : null);
      if (target) w.appendChild(el('div', 'sub', 'to ' + target));
      s.appendChild(w);
      clock += leg.w * 60000;
    } else {
      var dep = leg.d ? Date.parse(leg.d) : clock;
      s.appendChild(el('div', 't' + (leg.dl ? ' late' : ''), hhmm(dep)));
      s.appendChild(el('div', 'dot'));
      var what = el('div', 'what');
      what.appendChild(el('span', 'line', leg.n || VEHICLE[leg.v] || 'Ride'));
      what.appendChild(document.createTextNode(leg.h ? 'to ' + leg.h : (VEHICLE[leg.v] || '')));
      var bits = [leg.f ? 'from ' + leg.f : null, leg.p ? 'Spoor ' + leg.p : null, leg.t ? 'off at ' + leg.t + (leg.a ? ' ' + hhmm(leg.a) : '') : null];
      var sub = el('div', 'sub', bits.filter(Boolean).join(' · '));
      if (leg.dl) { sub.appendChild(document.createTextNode(' · ')); sub.appendChild(el('span', 'late', '+' + leg.dl + ' min')); }
      if (leg.c) { sub.appendChild(document.createTextNode(' · ')); sub.appendChild(el('span', 'late', 'cancelled')); }
      what.appendChild(sub);
      s.appendChild(what);
      clock = leg.a ? Date.parse(leg.a) : dep;
    }
    steps.appendChild(s);
  });
  var end = el('div', 'step');
  end.appendChild(el('div', 't', hhmm(o.a)));
  end.appendChild(el('div', 'dot'));
  end.appendChild(el('div', 'what', 'Arrive' + (trip.e ? ' · ' + trip.e : '')));
  steps.appendChild(end);
  main.appendChild(steps);

  // Take it along: the NS planner on exactly this train (stations and time
  // travel in the link), and Apple Maps, which can only plan from now.
  var actions = el('div', 'actions');
  var trains = (o.legs || []).filter(function (l) { return l.w == null && (l.v === 'train' || /^(SPR|IC|ICD|ICE|EC|THA)/.test(l.n || '')); });
  if (trains.length && trains[0].f && trains[trains.length - 1].t) {
    var dep = new Date(trains[0].d || o.l);
    var tijd = dep.getFullYear() + '-' + pad(dep.getMonth() + 1) + '-' + pad(dep.getDate()) + 'T' + pad(dep.getHours()) + ':' + pad(dep.getMinutes());
    var ns = el('a', 'btn primary', 'Open in NS');
    ns.href = 'https://www.ns.nl/reisplanner/#/?vertrek=' + encodeURIComponent(trains[0].f) + '&vertrektype=treinstation' +
      '&aankomst=' + encodeURIComponent(trains[trains.length - 1].t) + '&aankomsttype=treinstation&type=vertrek&tijd=' + tijd;
    actions.appendChild(ns);
  }
  if (trip.f && trip.t) {
    var apple = el('a', 'btn ' + (actions.children.length ? 'glass' : 'primary'));
    apple.appendChild(document.createTextNode('Apple Maps'));
    apple.appendChild(el('span', 'note', 'from now'));
    apple.href = 'https://maps.apple.com/?saddr=' + trip.f.join(',') + '&daddr=' + trip.t.join(',') + '&dirflg=r';
    actions.appendChild(apple);
  }
  if (actions.children.length === 1) actions.style.gridTemplateColumns = '1fr';
  if (actions.children.length) main.appendChild(actions);
})();
</script>
</body>
</html>
