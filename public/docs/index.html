<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV API">
<meta name="robots" content="noindex">
<title>tv-launcher API</title>
<style>
  @font-face { font-family: 'Iosevka'; font-weight: 300; src: url('/fonts/iosevka-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka'; font-weight: 400; src: url('/fonts/iosevka-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka'; font-weight: 500; src: url('/fonts/iosevka-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka Aile'; font-weight: 300; src: url('/fonts/iosevka-aile-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka Aile'; font-weight: 400; src: url('/fonts/iosevka-aile-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka Aile'; font-weight: 500; src: url('/fonts/iosevka-aile-latin-500-normal.woff2') format('woff2'); }

  /* The launcher, in a browser: a picture across the whole screen, the thing
     you're on named large in the corner, a row of tiles, and the answer in
     clear glass along the bottom. */
  :root {
    --text: #FFFFFF;
    --muted: rgba(255, 255, 255, 0.72);
    --faint: rgba(255, 255, 255, 0.5);
    --accent: #A9CBFF;
    --warn: #FFC066;
    --bad: #FF9E9E;
    --glass-fill: rgba(22, 20, 36, 0.14);
    --glass-edge: rgba(255, 255, 255, 0.16);
    --glass-blur: blur(14px) saturate(160%);
    --lift-1: 0 1px 2px rgba(10, 6, 30, 0.16), 0 6px 16px -6px rgba(10, 6, 30, 0.22);
    --lift-2: 0 2px 4px rgba(10, 6, 30, 0.18), 0 22px 44px -14px rgba(10, 6, 30, 0.5);
    --settle: cubic-bezier(0.22, 1, 0.36, 1);
    --mono: 'Iosevka', ui-monospace, monospace;
    --side: clamp(20px, 5.8vw, 112px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; -webkit-tap-highlight-color: transparent; color: var(--text); background: #6C6589; font-family: 'Iosevka Aile', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- the stage ---------- */
  .bg, .stage, .shade { position: fixed; inset: 0; }
  .bg { background:
          radial-gradient(55% 60% at 10% 4%, #C66C8D 0%, rgba(198,108,141,0) 72%),
          radial-gradient(50% 55% at 92% 12%, #C98A52 0%, rgba(201,138,82,0) 70%),
          radial-gradient(55% 60% at 2% 70%, #4E7DB8 0%, rgba(78,125,184,0) 72%),
          radial-gradient(60% 60% at 92% 88%, #7E5B9F 0%, rgba(126,91,159,0) 72%),
          #6C6589; }
  .stage { overflow: hidden; }
  /* Your forest, still: the glass does the moving. */
  .pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; opacity: 0; transition: opacity 1.2s ease; }
  .pic.on { opacity: 1; }
  .shade { pointer-events: none;
           background:
             radial-gradient(60% 50% at 12% 22%, rgba(10,8,24,0.5) 0%, rgba(10,8,24,0) 100%),
             linear-gradient(90deg, rgba(10,8,24,0.5) 0%, rgba(10,8,24,0.16) 40%, rgba(10,8,24,0) 62%),
             linear-gradient(0deg, rgba(10,8,24,0.42) 0%, rgba(10,8,24,0.16) 22%, rgba(10,8,24,0) 42%),
             linear-gradient(180deg, rgba(10,8,24,0.28) 0%, rgba(10,8,24,0) 20%),
             linear-gradient(rgba(10,8,24,0.16), rgba(10,8,24,0.16)); }

  .glass { background: var(--glass-fill);
           box-shadow: inset 0 0 0 1px var(--glass-edge), inset 0 1px 0 rgba(255,255,255,0.10), var(--lift-1);
           -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }

  .page { position: relative; height: 100%; }

  /* ---------- what you're on, top left ---------- */
  .about { position: absolute; left: var(--side); top: 9vh; width: min(980px, 62vw); display: flex; flex-direction: column; gap: 10px;
           transition: opacity 0.45s ease, transform 0.6s var(--settle); }
  .about.swap { opacity: 0; transform: translateY(8px); }
  .about-label { font-size: clamp(13px, 1.05vw, 20px); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-shadow: 0 1px 14px rgba(0,0,0,0.45); }
  .about-title { font-size: clamp(46px, 5.4vw, 96px); font-weight: 500; letter-spacing: -0.022em; line-height: 1.0; text-shadow: 0 2px 30px rgba(0,0,0,0.35); }
  .about-meta { font-size: clamp(16px, 1.3vw, 24px); color: var(--muted); text-shadow: 0 1px 14px rgba(0,0,0,0.45); }
  .about-desc { font-size: clamp(13px, 0.95vw, 17px); color: var(--faint); max-width: 62ch; line-height: 1.5; text-shadow: 0 1px 12px rgba(0,0,0,0.5);
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .about-desc:empty { display: none; }

  /* ---------- the row ---------- */
  .row { position: absolute; left: var(--side); right: var(--side); top: 41vh; }
  .viewport { margin: -72px calc(-1 * var(--side)); padding: 72px var(--side); overflow: hidden; }
  .track { display: flex; gap: clamp(14px, 1.5vw, 28px); transition: transform 0.5s var(--settle); }
  .tile { position: relative; flex-shrink: 0; width: clamp(190px, 16vw, 304px); aspect-ratio: 16 / 9; border-radius: clamp(16px, 1.3vw, 24px); overflow: hidden;
          border: 0; padding: clamp(14px, 1.15vw, 22px); text-align: left; cursor: pointer;
          display: flex; flex-direction: column; justify-content: space-between;
          background: rgba(22, 20, 36, 0.24) center / cover no-repeat;
          box-shadow: inset 0 0 0 1px var(--glass-edge), inset 0 1px 0 rgba(255,255,255,0.10), var(--lift-1);
          -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
          transform: translateZ(0); transition: transform 0.4s var(--settle), box-shadow 0.4s var(--settle); }
  .tile > * { position: relative; }
  .tile .route { font-family: var(--mono); font-size: clamp(12px, 0.95vw, 18px); color: var(--muted); letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; text-shadow: 0 1px 10px rgba(0,0,0,0.4); }
  .tile .name { font-size: clamp(20px, 1.6vw, 30px); font-weight: 500; letter-spacing: -0.01em; text-shadow: 0 1px 12px rgba(0,0,0,0.4); }
  .tile .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.35); transition: background 0.3s ease; }
  .tile .dot.ok { background: #9FE3B8; box-shadow: 0 0 10px rgba(159,227,184,0.7); }
  .tile .dot.warn { background: var(--warn); }
  .tile .dot.bad { background: var(--bad); }
  .tile .dot.busy { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .tile::after { content: ''; position: absolute; inset: -40% -60%; pointer-events: none;
                 background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0) 60%);
                 transform: translateX(-60%); opacity: 0; }
  .tile.focused { transform: scale(1.09) translateZ(0);
                  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), 0 0 0 3px rgba(255,255,255,0.95), var(--lift-2); }
  .tile.focused::after { animation: sheen 1.1s var(--settle) 0.05s both; }
  @keyframes sheen { from { transform: translateX(-60%); opacity: 1; } to { transform: translateX(60%); opacity: 0; } }
  .tile.pressed { transform: scale(1.03) translateZ(0); transition-duration: 0.09s; }
  .tile:focus { outline: none; }
  .caption { position: absolute; left: 0; margin-top: clamp(14px, 1.2vw, 22px); font-size: clamp(14px, 1.1vw, 22px); white-space: nowrap;
             text-shadow: 0 1px 12px rgba(20, 10, 50, 0.4); transition: transform 0.5s var(--settle); }

  /* ---------- the dock: the answer ---------- */
  .dock { position: absolute; left: var(--side); right: var(--side); bottom: 5.5vh; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
  .when { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .big { font-family: var(--mono); font-size: clamp(64px, 7vw, 136px); font-weight: 300; letter-spacing: -0.03em; line-height: 0.9; text-shadow: 0 2px 30px rgba(0,0,0,0.35);
         display: flex; align-items: baseline; gap: 0.12em; }
  .big small { font-size: 0.26em; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .line { font-size: clamp(16px, 1.45vw, 28px); padding: 12px 0 0 4px; text-shadow: 0 1px 16px rgba(0,0,0,0.3); }
  .line .warn { color: var(--warn); } .line .bad { color: var(--bad); }
  .tools { display: flex; gap: 10px; padding: 8px 0 0 4px; }
  .round { width: 46px; height: 46px; border-radius: 23px; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--text);
           transition: transform 0.3s var(--settle), background 0.2s ease, color 0.2s ease; }
  .round:focus-visible { background: #fff; color: #1a1630; transform: scale(1.1); box-shadow: var(--lift-2); outline: none; }
  @media (hover: hover) { .round:hover { background: #fff; color: #1a1630; transform: scale(1.1); box-shadow: var(--lift-2); } }
  .round:active { background: #fff; color: #1a1630; }
  .round:active { transform: scale(1.0); }
  .round svg { width: 21px; height: 21px; }

  .now { display: flex; gap: 22px; align-items: flex-end; justify-content: flex-end; min-width: 0; flex: 1; }
  .card { border-radius: 26px; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px; width: clamp(260px, 27vw, 520px); min-width: 0; flex-shrink: 1;
          max-height: 30vh; overflow: auto; text-shadow: 0 1px 10px rgba(0,0,0,0.35); animation: rise 0.7s var(--settle) both; scrollbar-width: none; }
  .card::-webkit-scrollbar { display: none; }
  .card + .card { animation-delay: 0.06s; }
  .card.wide { width: clamp(300px, 34vw, 640px); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: none; } }
  .card .head { display: flex; justify-content: space-between; gap: 12px; font-size: clamp(13px, 1vw, 19px); color: var(--muted); }
  .card .head .mono, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card .title { font-size: clamp(19px, 1.5vw, 28px); font-weight: 500; letter-spacing: -0.012em; line-height: 1.15; }
  .card .sub { font-size: clamp(14px, 1.05vw, 20px); color: var(--muted); }
  .card .leave { font-size: clamp(15px, 1.15vw, 22px); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .card .leave b { font-family: var(--mono); font-weight: 500; color: var(--accent); }
  .card .leave.late b, .card .warn { color: var(--warn); }
  .card .bad { color: var(--bad); }
  .card .item { display: flex; flex-direction: column; gap: 2px; }
  .card .item + .item { padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
  .card .url { font-size: clamp(15px, 1.15vw, 21px); word-break: break-all; white-space: normal; }
  .facts { display: flex; flex-direction: column; gap: 4px; }
  .fact { display: flex; justify-content: space-between; gap: 16px; font-size: clamp(13px, 1vw, 18px); color: var(--muted); }
  .fact .mono { color: var(--text); }
  .json.inline { flex: none; overflow: visible; padding: 8px 0 0 18px; border-top: 1px solid rgba(255,255,255,0.1); }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .steps i { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.22); }
  .steps i.done { background: var(--accent); }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .thumbs a { aspect-ratio: 16 / 9; border-radius: 10px; background: rgba(255,255,255,0.08) center / cover no-repeat; box-shadow: inset 0 0 0 1px var(--glass-edge), var(--lift-1); }

  .input { width: 100%; border: 0; outline: none; border-radius: 14px; padding: 12px 14px; background: rgba(10, 8, 24, 0.22);
           box-shadow: inset 0 0 0 1px var(--glass-edge); font-family: var(--mono); font-size: clamp(13px, 1vw, 17px); }
  .input:focus { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6); }
  textarea.input { min-height: 15vh; resize: vertical; line-height: 1.5; }
  .token-row { display: flex; gap: 10px; }
  .token-row .input { flex: 1; min-width: 0; }
  .send { align-self: flex-start; border: 0; border-radius: 14px; padding: 10px 20px; cursor: pointer; background: #fff; color: #1a1630; font-weight: 500;
          box-shadow: var(--lift-2); transition: transform 0.3s var(--settle); }
  .send:active { transform: scale(0.96); }
  .send:disabled { opacity: 0.6; cursor: default; }

  /* ---------- the raw answer: a sheet of glass from below ---------- */
  .sheet { position: fixed; top: 5vh; bottom: 5vh; right: var(--side); width: min(620px, 44vw); border-radius: 28px; z-index: 5;
           --glass-fill: rgba(16, 14, 30, 0.42);
           display: flex; flex-direction: column; opacity: 0; visibility: hidden; transform: translateX(40px) scale(0.98);
           transition: opacity 0.35s ease, transform 0.6s var(--settle), visibility 0s linear 0.6s; }
  .sheet.open { opacity: 1; visibility: visible; transform: none; transition: opacity 0.35s ease, transform 0.6s var(--settle), visibility 0s; }
  .sheet-head { display: flex; align-items: center; gap: 14px; padding: 22px 26px 14px; }
  .sheet-head .route { font-family: var(--mono); font-size: clamp(16px, 1.3vw, 24px); margin-right: auto; }
  .sheet-head .round { width: 40px; height: 40px; }
  .json { flex: 1; overflow: auto; padding: 4px 26px 30px; font: clamp(13px, 0.95vw, 16px)/1.7 var(--mono); text-shadow: 0 1px 8px rgba(0,0,0,0.35); scrollbar-width: thin; }
  .json details { padding-left: 18px; }
  .json details > summary { list-style: none; cursor: pointer; margin-left: -18px; }
  .json details > summary::-webkit-details-marker { display: none; }
  .json details > summary::before { content: '›'; display: inline-block; width: 18px; color: var(--faint); transition: transform 0.25s var(--settle); }
  .json details[open] > summary::before { transform: rotate(90deg); }
  .json details[open] > summary .fold { display: none; }
  .json .leaf { padding-left: 18px; white-space: pre-wrap; word-break: break-word; }
  .json .k { color: var(--muted); } .json .s { color: #fff; } .json .n { color: var(--accent); } .json .b { color: var(--warn); }
  .json .p, .json .fold { color: var(--faint); }
  .json a { text-decoration-color: rgba(255,255,255,0.3); }

  .toast { position: fixed; left: 50%; top: 4vh; transform: translate(-50%, -10px); opacity: 0; padding: 10px 18px; border-radius: 14px; z-index: 6;
           transition: opacity 0.25s ease, transform 0.5s var(--settle); pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- small screens: the same pieces, one under the other ---------- */
  /* ---------- phone: one column you scroll, the row you swipe ---------- */
  @media (max-width: 860px), (max-height: 620px) {
    :root { --side: 20px; }
    body { overflow-y: auto; overflow-x: hidden; }
    .page { height: auto; min-height: 100%;
            padding: calc(env(safe-area-inset-top) + 7vh) 0 calc(env(safe-area-inset-bottom) + 28px); }
    .about, .row, .dock { position: relative; left: auto; right: auto; top: auto; bottom: auto; }
    .about { margin: 0 var(--side); width: auto; gap: 8px; }
    .about-title { font-size: clamp(44px, 13vw, 64px); }
    .about-desc { -webkit-line-clamp: 3; }
    .row { margin: 28px 0 0; }
    .viewport { margin: -40px 0 -50px; padding: 58px var(--side) 72px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--side);
                -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .viewport::-webkit-scrollbar { display: none; }
    .track { transform: none !important; transition: none; }
    .track::after { content: ''; flex: 0 0 1px; }                 /* room after the last tile */
    .tile { width: min(62vw, 240px); scroll-snap-align: start; }
    .caption { display: none; }
    .dock { margin: 6px var(--side) 0; flex-direction: column; align-items: stretch; gap: 18px; }
    .when { flex-direction: row; flex-wrap: wrap; align-items: flex-end; column-gap: 16px; row-gap: 12px; }
    .big { font-size: 64px; }
    .line { padding: 0 0 8px; font-size: 17px; }
    .tools { width: 100%; padding: 0; gap: 12px; }
    .round { width: 48px; height: 48px; border-radius: 24px; }
    .now { flex-direction: column; align-items: stretch; gap: 16px; }
    .card, .card.wide { width: auto; max-height: none; padding: 20px; border-radius: 24px; }
    .input { font-size: 16px; }                                    /* 16px: iOS doesn't zoom in on focus */
    .json.inline { overflow-x: auto; }
    .sheet { left: 0; right: 0; width: auto; top: calc(env(safe-area-inset-top) + 8vh); bottom: 0; border-radius: 26px 26px 0 0;
             transform: translateY(40px); }
    .sheet.open { transform: none; }
    .sheet-head { padding: 18px 20px 10px; }
    .sheet-head .round { width: 44px; height: 44px; }
    .json { padding: 4px 20px calc(env(safe-area-inset-bottom) + 24px); font-size: 13px; }
    .toast { top: calc(env(safe-area-inset-top) + 12px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pic, .track, .tile, .about, .caption, .sheet, .round { transition-duration: 0.01s !important; }
    .card { animation: none; } .tile::after { display: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="stage" aria-hidden="true"><img class="pic" id="forest" src="forest.jpg" alt=""></div>
<div class="shade" aria-hidden="true"></div>

<div class="page">
  <div class="about" id="about"><div class="about-label" id="aboutLabel"></div><div class="about-title" id="aboutTitle">tv-launcher</div><div class="about-meta" id="aboutMeta"></div><div class="about-desc" id="aboutDesc"></div></div>

  <section class="row" aria-label="Endpoints">
    <div class="viewport"><div class="track" id="track"></div></div>
    <div class="caption" id="caption"></div>
  </section>

  <div class="dock">
    <div class="when">
      <div class="big" id="big">–</div>
      <div class="line" id="line"></div>
      <div class="tools">
        <button class="round glass" id="runBtn" title="Run again (Enter)" aria-label="Run again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
        <button class="round glass" id="jsonBtn" title="Raw answer (J)" aria-label="Raw answer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4c-2 0-3 1-3 3v2c0 1.5-1 3-2 3 1 0 2 1.5 2 3v2c0 2 1 3 3 3"/><path d="M16 4c2 0 3 1 3 3v2c0 1.5 1 3 2 3-1 0-2 1.5-2 3v2c0 2-1 3-3 3"/></svg></button>
        <button class="round glass" id="curlBtn" title="Copy as curl" aria-label="Copy as curl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
        <button class="round glass" id="keyBtn" title="Token" aria-label="Token"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M17 6l3 3"/><path d="M15 8l2 2"/></svg></button>
      </div>
    </div>
    <div class="now" id="now"></div>
  </div>
</div>

<div class="sheet glass" id="sheet" aria-hidden="true">
  <div class="sheet-head">
    <div class="route" id="sheetRoute"></div>
    <button class="round glass" id="copyJson" title="Copy JSON" aria-label="Copy JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
    <button class="round glass" id="closeSheet" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="json" id="json"></div>
</div>
<div class="toast glass" id="toast"></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function stored(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function store(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(d) { d = new Date(d); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function ago(iso) {
    var s = (Date.now() - Date.parse(iso)) / 1000;
    if (!isFinite(s)) return '';
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return new Date(iso).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});
  }
  function forHow(sec) { return sec >= 3600 ? sec / 3600 + ' h' : sec / 60 + ' min'; }
  function toast(text) { var t = $('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 1600); }
  function copy(text, what) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast(what + ' copied'); }, function () { toast('Couldn’t copy'); });
  }

  var tokens = {feed: stored('tvl.token'), inbound: stored('tvl.inbound')};
  (function () {
    var q = new URLSearchParams(location.search), t = q.get('token');
    if (!t) return;
    tokens.feed = t; store('tvl.token', t);
    history.replaceState(null, '', location.pathname + location.hash);
  })();
  var endpoints = [], results = {}, focus = 0, bodies = {};

  /* ================= the row ================= */
  function load() {
    fetch('/openapi.json').then(function (r) { return r.json(); }).then(function (spec) {
      Object.keys(spec.paths).forEach(function (path) {
        Object.keys(spec.paths[path]).forEach(function (method) {
          var op = spec.paths[path][method];
          endpoints.push({path: path, method: method, op: op, name: op['x-name'] || path, inbound: !!(op.security && op.security[0] && op.security[0].inboundToken)});
        });
      });
      buildRow();
      var start = endpoints.map(function (e) { return e.method + e.path; }).indexOf(decodeURIComponent(location.hash.slice(1)));
      setFocus(start >= 0 ? start : 0, true);
      checkAll();
    }).catch(function () { $('aboutMeta').textContent = 'Couldn’t load /openapi.json.'; });
  }

  function buildRow() {
    var track = $('track');
    track.textContent = '';
    endpoints.forEach(function (ep, i) {
      var t = el('button', 'tile');
      t.type = 'button';
      var route = el('div', 'route');
      route.appendChild(el('span', null, ep.method.toUpperCase() + ' ' + ep.path.replace('/api', '')));
      ep.dot = el('span', 'dot');
      route.appendChild(ep.dot);
      t.appendChild(route);
      t.appendChild(el('div', 'name', ep.name));
      t.addEventListener('click', function () { if (focus === i) run(ep); else setFocus(i); });
      ep.tile = t;
      track.appendChild(t);
    });
  }

  function setFocus(i, instant) {
    focus = Math.max(0, Math.min(endpoints.length - 1, i));
    var ep = endpoints[focus];
    endpoints.forEach(function (e, j) { e.tile.classList.toggle('focused', j === focus); });
    history.replaceState(null, '', '#' + ep.method + ep.path);
    slide(instant);
    about(ep);
    dock(ep);
    if (!sheetClosed()) openSheet();
  }

  /* Move the row only as far as it takes to keep the focused tile in view. */
  var offset = 0;
  var phone = window.matchMedia('(max-width: 860px), (max-height: 620px)');
  function slide(instant) {
    var t = endpoints[focus].tile, track = $('track');
    if (phone.matches) {
      var vp = track.parentNode, pad = parseFloat(getComputedStyle(vp).paddingLeft) || 0;
      var target = t.offsetLeft - pad;
      if (t.offsetLeft < vp.scrollLeft + pad || t.offsetLeft + t.offsetWidth > vp.scrollLeft + vp.clientWidth - pad)
        vp.scrollTo({left: target, behavior: instant ? 'auto' : 'smooth'});
      return;
    }
    var view = track.parentNode.clientWidth - 2 * parseFloat(getComputedStyle(track.parentNode).paddingLeft);
    var left = t.offsetLeft, right = left + t.offsetWidth;
    if (right + offset > view - 40) offset = view - 40 - right;
    if (left + offset < 0) offset = -left;
    offset = Math.min(0, offset);
    if (instant) track.style.transition = 'none';
    track.style.transform = 'translateX(' + offset + 'px)';
    $('caption').style.transform = 'translateX(' + (left + offset) + 'px)';
    if (instant) { track.getBoundingClientRect(); track.style.transition = ''; }
  }

  var aboutTimer = null;
  function about(ep) {
    var box = $('about');
    box.classList.add('swap');
    clearTimeout(aboutTimer);
    aboutTimer = setTimeout(function () {
      var cache = ep.op['x-cache'] ? 'cached ' + forHow(ep.op['x-cache']) : 'never cached';
      $('aboutLabel').textContent = [ep.method.toUpperCase() + ' ' + ep.path, cache].join(' · ');
      $('aboutTitle').textContent = ep.name;
      $('aboutMeta').textContent = ep.op.summary || '';
      $('aboutDesc').textContent = ep.op.description || '';
      box.classList.remove('swap');
    }, 260);
  }

  /* ================= the picture behind it ================= */
  var forest = $('forest');
  if (forest.complete) forest.classList.add('on'); else forest.onload = function () { forest.classList.add('on'); };

  /* ================= calling ================= */
  function tokenFor(ep) { return ep.inbound ? tokens.inbound : tokens.feed; }
  function urlFor(ep, placeholder, fresh) {
    var t = placeholder ? (ep.inbound ? 'INBOUND_TOKEN' : 'FEED_TOKEN') : encodeURIComponent(tokenFor(ep));
    return location.origin + ep.path + '?token=' + t + (fresh ? '&fresh=' + Date.now() : '');
  }

  function call(ep, fresh) {
    var init = {method: ep.method.toUpperCase()};
    if (ep.method === 'post') { init.headers = {'Content-Type': 'application/json'}; init.body = bodyFor(ep); }
    var started = performance.now();
    ep.dot.className = 'dot busy';
    return fetch(urlFor(ep, false, fresh), init).then(function (r) {
      return r.text().then(function (text) {
        var data = null;
        try { data = JSON.parse(text); } catch (e) { data = null; }
        return {status: r.status, ok: r.ok, ms: Math.round(performance.now() - started), cache: r.headers.get('x-vercel-cache'), type: r.headers.get('content-type'), bytes: new Blob([text]).size, data: data, text: text, at: new Date()};
      });
    }, function (err) {
      return {status: 0, ok: false, ms: Math.round(performance.now() - started), data: null, text: String(err), at: new Date()};
    }).then(function (res) {
      results[ep.path] = res;
      var problem = res.ok && res.data && (res.data.error || res.data.configured === false);
      ep.dot.className = 'dot ' + (res.ok ? (problem ? 'warn' : 'ok') : res.status === 401 ? 'warn' : 'bad');
      if (endpoints[focus] === ep) { dock(ep); if (!sheetClosed()) openSheet(); }
      return res;
    });
  }

  function run(ep) {
    if (!tokenFor(ep)) { askToken(ep); return; }
    ep.tile.classList.add('pressed');
    setTimeout(function () { ep.tile.classList.remove('pressed'); }, 120);
    if (ep.method === 'post') {
      try { JSON.parse(bodyFor(ep)); } catch (e) { toast('The body isn’t valid JSON'); return; }
    }
    call(ep, true);
  }

  /* Every GET once, through the edge cache, so each tile shows if it's up. */
  function checkAll() {
    if (!tokens.feed) return;
    endpoints.filter(function (e) { return e.method === 'get'; })
      .forEach(function (ep) { call(ep); });
  }

  /* ================= the dock ================= */
  function dock(ep) {
    var res = results[ep.path];
    var big = $('big'), line = $('line'), now = $('now');
    big.textContent = '';
    line.textContent = '';
    now.textContent = '';
    $('caption').textContent = ep.name;

    if (!tokenFor(ep)) {
      big.textContent = '–';
      line.textContent = 'No token yet';
      now.appendChild(tokenCard(ep));
      return;
    }
    now.appendChild(requestCard(ep, res));
    if (!res) {
      big.textContent = '–';
      line.textContent = ep.method === 'post' ? 'Not sent yet' : 'Asking…';
      return;
    }
    big.appendChild(document.createTextNode(res.status ? res.ms : '–'));
    big.appendChild(el('small', null, res.status ? 'ms' : ''));
    line.appendChild(el('span', res.ok ? null : res.status === 401 || res.status === 405 ? 'warn' : 'bad', res.status ? String(res.status) : 'no answer'));
    var rest = [res.cache ? 'cache ' + res.cache.toLowerCase() : null, hhmm(res.at)].filter(Boolean);
    if (rest.length) line.appendChild(document.createTextNode(' · ' + rest.join(' · ')));
    $('caption').textContent = ep.name + (res.status ? ' · ' + res.ms + ' ms' : '');
    now.appendChild(responseCard(ep, res));
  }

  var REASONS = {200: 'OK', 400: 'Bad request', 401: 'Unauthorised', 404: 'Not found', 405: 'Method not allowed', 500: 'Server error', 502: 'Bad gateway', 504: 'Timed out'};
  function size(b) { return b == null ? '' : b > 1024 ? (b / 1024).toFixed(1) + ' kB' : b + ' B'; }

  /* What goes out: method, URL (token masked), how it's authorised and cached. */
  function requestCard(ep, res) {
    var c = card('Request', ep.method.toUpperCase(), ep.method === 'post');
    c.appendChild(el('div', 'title mono url', ep.path + '?token=' + (tokenFor(ep) ? '••••••' : (ep.inbound ? 'INBOUND_TOKEN' : 'FEED_TOKEN'))));
    var facts = el('div', 'facts');
    fact(facts, 'Auth', (ep.inbound ? 'INBOUND_TOKEN' : 'FEED_TOKEN') + ' in the query');
    fact(facts, 'Cache', ep.op['x-cache'] ? forHow(ep.op['x-cache']) + ' at the edge' : 'none');
    if (ep.op.requestBody) fact(facts, 'Body', 'JSON');
    c.appendChild(facts);
    if (res && res.status === 401) c.appendChild(tokenField(ep));
    if (ep.method === 'post') {
      c.appendChild(el('div', 'sub', 'This really runs: a shipping email costs a Claude call and can put a parcel on the TV. The example is a newsletter, dropped for free; each MessageID is handled once.'));
      var ta = el('textarea', 'input');
      ta.spellcheck = false;
      ta.value = bodyFor(ep);
      ta.addEventListener('input', function () { bodies[ep.path] = ta.value; });
      ta.addEventListener('keydown', function (e) { e.stopPropagation(); if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run(ep); });
      c.appendChild(ta);
      var go = el('button', 'send', 'Send');
      go.type = 'button';
      go.addEventListener('click', function () { run(ep); });
      c.appendChild(go);
    }
    return c;
  }

  /* What comes back: status, size, type, and the JSON itself. */
  function responseCard(ep, res) {
    var c = card('Response', res.status ? res.status + ' ' + (REASONS[res.status] || '') : 'no answer', true);
    var facts = el('div', 'facts');
    fact(facts, 'Size', size(res.bytes));
    if (res.type) fact(facts, 'Type', res.type.split(';')[0]);
    if (res.cache) fact(facts, 'Edge', res.cache.toLowerCase());
    c.appendChild(facts);
    var j = el('div', 'json inline');
    if (res.data != null) j.appendChild(node(res.data, null, 0, 1));
    else j.appendChild(el('div', 'leaf', res.text || ''));
    c.appendChild(j);
    return c;
  }
  function fact(box, k, v) { var r = el('div', 'fact'); r.appendChild(el('span', null, k)); r.appendChild(el('span', 'mono', v)); box.appendChild(r); }

  function card(label, right, wide) {
    var c = el('div', 'card glass' + (wide ? ' wide' : ''));
    if (label != null) {
      var h = el('div', 'head');
      h.appendChild(el('span', null, label));
      if (right) h.appendChild(el('span', 'mono', right));
      c.appendChild(h);
    }
    return c;
  }

  function tokenField(ep) {
    var inp = el('input', 'input');
    inp.type = 'password';
    inp.placeholder = ep.inbound ? 'INBOUND_TOKEN' : 'FEED_TOKEN';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.value = tokenFor(ep);
    inp.setAttribute('autocapitalize', 'off');
    inp.setAttribute('autocorrect', 'off');
    inp.setAttribute('enterkeyhint', 'done');
    var save = function () { saveToken(ep, inp.value.trim()); };
    inp.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') save(); });
    var row = el('div', 'token-row');
    row.appendChild(inp);
    var b = el('button', 'send', 'Save');
    b.type = 'button';
    b.addEventListener('click', save);
    row.appendChild(b);
    return row;
  }
  function saveToken(ep, v) {
    if (ep.inbound) { tokens.inbound = v; store('tvl.inbound', v); } else { tokens.feed = v; store('tvl.token', v); results = {}; }
    dock(ep);
    if (!ep.inbound) checkAll();
  }
  function tokenCard(ep) {
    var c = card(ep.inbound ? 'Inbound token' : 'Token');
    c.appendChild(el('div', 'title', ep.inbound ? 'The webhook has its own token' : 'Paste your token'));
    c.appendChild(el('div', 'sub', (ep.inbound ? 'INBOUND_TOKEN' : 'FEED_TOKEN') + ' from Vercel → Settings → Environment Variables, then Save. It stays in this browser.'));
    var f = tokenField(ep);
    c.appendChild(f);
    if (!phone.matches) setTimeout(function () { if (document.activeElement === document.body) f.querySelector('input').focus(); }, 50);
    return c;
  }
  function askToken(ep) { dock(ep); var i = $('now').querySelector('input'); if (i) i.focus(); }

  function bodyFor(ep) {
    if (bodies[ep.path] == null) {
      var ex = ep.op.requestBody && ep.op.requestBody.content['application/json'].example;
      bodies[ep.path] = JSON.stringify(ex || {}, null, 2);
    }
    return bodies[ep.path];
  }
  /* ================= the raw answer ================= */
  var sheetOpen = false;
  function sheetClosed() { return !sheetOpen; }
  function openSheet() {
    var ep = endpoints[focus], res = results[ep.path];
    $('sheetRoute').textContent = ep.method.toUpperCase() + ' ' + ep.path + (res && res.status ? '  ·  ' + res.status : '');
    var box = $('json');
    box.textContent = '';
    if (!res) box.appendChild(el('div', 'p', 'Nothing yet: run it first.'));
    else if (res.data != null) box.appendChild(node(res.data, null, 0));
    else box.appendChild(el('div', 'leaf', res.text));
    $('sheet').classList.add('open');
    $('sheet').setAttribute('aria-hidden', 'false');
    sheetOpen = true;
  }
  function closeSheet() { $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true'); sheetOpen = false; }
  function node(value, key, depth, openTo) {
    if (value && typeof value === 'object') {
      var isArr = Array.isArray(value);
      var keys = isArr ? value.map(function (_, i) { return i; }) : Object.keys(value);
      var d = el('details');
      d.open = openTo != null ? depth < openTo : (depth < 3 && keys.length <= 12 || keys.length <= 3);
      var s = el('summary');
      if (key != null) { s.appendChild(el('span', 'k', String(key))); s.appendChild(el('span', 'p', '  ')); }
      s.appendChild(el('span', 'p', isArr ? '[' : '{'));
      s.appendChild(el('span', 'fold', ' ' + keys.length + (isArr ? ' ]' : ' }')));
      d.appendChild(s);
      keys.forEach(function (k) { d.appendChild(node(value[k], k, depth + 1, openTo)); });
      d.appendChild(el('div', 'p', isArr ? ']' : '}'));
      return d;
    }
    var row = el('div', 'leaf');
    if (key != null) { row.appendChild(el('span', 'k', String(key))); row.appendChild(el('span', 'p', '  ')); }
    if (typeof value === 'string' && /^https?:\/\//.test(value)) { var a = el('a', 's', value); a.href = value; a.target = '_blank'; a.rel = 'noopener'; row.appendChild(a); }
    else row.appendChild(el('span', typeof value === 'string' ? 's' : typeof value === 'number' ? 'n' : 'b', typeof value === 'string' ? value : String(value)));
    return row;
  }

  /* ================= keys and buttons ================= */
  $('runBtn').addEventListener('click', function () { run(endpoints[focus]); });
  $('jsonBtn').addEventListener('click', function () { sheetOpen ? closeSheet() : openSheet(); });
  $('closeSheet').addEventListener('click', closeSheet);
  $('copyJson').addEventListener('click', function () { var r = results[endpoints[focus].path]; if (r) copy(r.data != null ? JSON.stringify(r.data, null, 2) : r.text, 'JSON'); });
  $('curlBtn').addEventListener('click', function () {
    var ep = endpoints[focus], url = urlFor(ep, true);
    copy(ep.method === 'post' ? "curl -X POST '" + url + "' -H 'Content-Type: application/json' -d '" + bodyFor(ep).replace(/'/g, "'\\''") + "'" : "curl '" + url + "'", 'curl');
  });
  $('keyBtn').addEventListener('click', function () {
    var ep = endpoints[focus];
    var now = $('now');
    now.textContent = '';
    now.appendChild(tokenCard(ep));
    now.querySelector('input').focus();
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') { setFocus(focus + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { setFocus(focus - 1); e.preventDefault(); }
    else if (e.key === 'Enter') { run(endpoints[focus]); e.preventDefault(); }
    else if (e.key === 'j' || e.key === 'J') { sheetOpen ? closeSheet() : openSheet(); }
    else if (e.key === 'Escape') closeSheet();
  });
  window.addEventListener('resize', function () { if (endpoints.length) slide(true); });
  if (phone.addEventListener) phone.addEventListener('change', function () { $('track').style.transform = ''; offset = 0; if (endpoints.length) slide(true); });

  load();
})();
</script>
</body>
</html>
