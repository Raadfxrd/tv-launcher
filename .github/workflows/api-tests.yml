name: API tests

# Vercel deploys on its own through its Git integration; this only makes sure
# the feed logic still passes its tests on every push.
on:
  push:
    paths-ignore: ["tv/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
