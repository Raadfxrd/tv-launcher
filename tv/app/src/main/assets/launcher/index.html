<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  @font-face { font-family: 'Iosevka'; font-weight: 300; src: url('fonts/iosevka-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka'; font-weight: 400; src: url('fonts/iosevka-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka'; font-weight: 500; src: url('fonts/iosevka-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka Aile'; font-weight: 300; src: url('fonts/iosevka-aile-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka Aile'; font-weight: 400; src: url('fonts/iosevka-aile-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Iosevka Aile'; font-weight: 500; src: url('fonts/iosevka-aile-latin-500-normal.woff2') format('woff2'); }

  :root {
    --text: #FFFFFF;
    --muted: rgba(255, 255, 255, 0.72);   /* vibrancy: white at strength, not flat grey, over colour */
    --faint: rgba(255, 255, 255, 0.5);
    --accent: #A9CBFF;
    --warn: #FFC066;
    /* Glass, as in home-dashboard: a faint fill over whatever is behind,
       blurred and saturated, a hairline edge, and light catching the top.
       A touch darker than the dashboard's, because this sits on colour. */
    --glass-fill: rgba(18, 18, 18, 0.14);
    --glass-edge: rgba(255, 255, 255, 0.16);
    --glass-blur: blur(14px) saturate(160%);
    /* Shadows the way light falls from above: a tight contact shadow plus a
       wide soft one that sits lower and fades out, never one dark blob. */
    --lift-1: 0 1px 2px rgba(0,0,0, 0.16), 0 6px 16px -6px rgba(0,0,0, 0.22);
    --lift-2: 0 2px 4px rgba(0,0,0, 0.18), 0 22px 44px -14px rgba(0,0,0, 0.5);
    --settle: cubic-bezier(0.22, 1, 0.36, 1);   /* critically damped: arrives and settles, never overshoots */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: var(--text); font-family: 'Iosevka Aile', system-ui, sans-serif; cursor: none; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'Iosevka', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- the stage ----------
     The whole screen is whatever the focused tile is about: what's popular on
     that service right now, the album of what's playing on Tidal, or one of
     nothing at all. Two layers crossfade; a shade on the left
     and along the bottom keeps the text and glass readable on any picture. */
  .bg { position: fixed; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 0;
        background: #000; }
  /* Black and white when the focused tile has nothing of its own to show. */
  body.plain { --accent: #FFFFFF; }
  body.plain .glass { background: rgba(255, 255, 255, 0.06); }
  .stage { position: fixed; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 0; overflow: hidden; }
  .stage .pic { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; object-fit: cover; object-position: 50% 22%;
                opacity: 0; transition: opacity 0.9s ease; will-change: opacity; }
  .stage .pic.on { opacity: 1; }
  /* Album art is small: blown up and blurred it becomes light in the album's colours. */
  .stage .pic.soft { filter: blur(70px) saturate(150%) brightness(0.8); top: -140px; left: -140px; width: 2200px; height: 1360px; }

  .shade { position: fixed; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 0; pointer-events: none;
           background:
             radial-gradient(60% 50% at 12% 22%, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%),
             linear-gradient(90deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.18) 40%, rgba(0,0,0,0) 62%),
             linear-gradient(0deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.16) 22%, rgba(0,0,0,0) 42%),
             linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 20%); }

  .glass { background: var(--glass-fill);
           box-shadow: inset 0 0 0 1px var(--glass-edge), inset 0 1px 0 rgba(255,255,255,0.10), var(--lift-1);
           -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
  .lite .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(18, 18, 18, 0.6); }

  .page { position: relative; z-index: 1; width: 1920px; height: 1080px; }

  /* ---------- what's on the stage, top left ---------- */
  .about { position: absolute; left: 112px; top: 132px; width: 980px; display: flex; flex-direction: column; gap: 12px;
           transition: opacity 0.45s ease, transform 0.6s var(--settle); }
  .about.swap { opacity: 0; transform: translateY(8px); }
  .about-label { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .about-title { font-size: 76px; font-weight: 500; letter-spacing: -0.022em; line-height: 1.02;
                 display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .about-meta { font-size: 24px; color: var(--muted); }
  .about-title:empty, .about-meta:empty, .about-label:empty { display: none; }

  /* ---------- the dock: time on the left, what's next on the right ---------- */
  .dock { position: absolute; left: 112px; right: 112px; bottom: 60px; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
  .when { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .clock { font-family: 'Iosevka', monospace; font-size: 136px; font-weight: 300; letter-spacing: -0.03em; line-height: 0.9; }
  .clock span { display: inline-block; }
  .date { font-size: 28px; padding: 14px 0 0 4px; }
  .status { display: flex; align-items: center; gap: 12px; font-size: 24px; color: var(--muted); padding: 2px 0 0 4px; min-height: 48px; }

  /* Settings: a gear at the end of the date line, one press down from the apps. */
  .gear { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 24px; margin-left: 8px; color: var(--text); flex-shrink: 0;
          transition: transform 0.3s var(--settle), background 0.2s ease, color 0.2s ease; }
  .row.active .gear.focused { background: #fff; color: #111; transform: scale(1.12); box-shadow: var(--lift-2); }
  .row.active .gear.focused.pressed { transform: scale(1.0); }

  .now { display: flex; gap: 24px; align-items: flex-end; justify-content: flex-end; min-width: 0; }
  .card { width: 520px; flex-shrink: 1; min-width: 0; border-radius: 26px; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px; animation: rise 0.7s var(--settle) both; }
  .card.next { width: 620px; }
  .card + .card { animation-delay: 0.06s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: none; } }
  .card .head { display: flex; justify-content: space-between; font-size: 19px; color: var(--muted); letter-spacing: 0.01em; }
  .card .title { font-size: 28px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: 20px; color: var(--muted); }
  .card .leave { font-size: 22px; display: flex; gap: 12px; align-items: baseline; padding-top: 2px; white-space: nowrap; min-width: 0; }
  .card .leave .sub { overflow: hidden; text-overflow: ellipsis; }
  .card .leave b { font-family: 'Iosevka', monospace; font-weight: 500; color: var(--accent); }
  .card .leave.late b, .warn { color: var(--warn); }
  .card .art { width: 64px; height: 64px; border-radius: 12px; background: rgba(0,0,0,0.25) center / cover no-repeat; flex-shrink: 0; box-shadow: var(--lift-1); }
  .card .media { display: flex; gap: 18px; align-items: center; min-width: 0; }
  .card .media > div:last-child { min-width: 0; }
  .parcel .head { color: var(--text); font-size: 20px; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .steps i { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.22); }
  .steps i.done { background: var(--accent); }

  /* ---------- rows of tiles ---------- */
  .row { position: relative; display: flow-root; }   /* flow-root: the track's negative margins must not leak out */
  .row-label { font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); padding: 0 0 14px 2px; transition: color 0.3s ease; }
  .row.active .row-label { color: var(--muted); }
  /* Generous room around the track, so a focused tile's scale and shadow are
     never clipped into a hard edge. */
  .viewport { margin: -56px -112px; padding: 56px 112px; overflow: hidden; }
  .track { display: flex; gap: 28px; transition: transform 0.4s var(--settle); }

  .tile { position: relative; flex-shrink: 0; width: 304px; height: 171px; border-radius: 24px; overflow: hidden;
          background: rgba(255,255,255,0.06) center / cover no-repeat;
          box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), var(--lift-1);
          transform: translateZ(0);
          transition: transform 0.3s var(--settle), opacity 0.3s ease; }
  .tile .name { position: absolute; left: 22px; bottom: 18px; right: 22px; font-size: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.banner .name { display: none; }
  .tile.text { display: flex; flex-direction: column; justify-content: space-between; padding: 22px; }
  .tile.text .name { position: static; font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
  .tile .port { font-family: 'Iosevka', monospace; font-size: 18px; color: var(--muted); letter-spacing: 0.04em; }
  /* A sheen that glides across the tile as it takes focus, like light moving
     over glass as it tilts toward you. */
  .tile::after { content: ''; position: absolute; inset: -40% -60%; pointer-events: none;
                 background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0) 60%);
                 transform: translateX(-60%); opacity: 0; }
  .row.active .tile.focused { transform: scale(1.09) translateZ(0);
                              box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), 0 0 0 3px rgba(255,255,255,0.95), var(--lift-2); }
  .row.active .tile.focused::after { animation: sheen 1.1s var(--settle) 0.05s both; }
  @keyframes sheen { from { transform: translateX(-60%); opacity: 1; } to { transform: translateX(60%); opacity: 0; } }
  /* Pressing OK answers immediately, before anything opens. */
  .row.active .tile.focused.pressed { transform: scale(1.03) translateZ(0); transition-duration: 0.09s; }

  .caption { position: absolute; left: 0; height: 30px; font-size: 22px; color: var(--text); white-space: nowrap; opacity: 0;
             transition: opacity 0.25s ease, transform 0.5s var(--settle); }
  .row.active .caption { opacity: 1; }

  #row-apps { position: absolute; left: 112px; right: 112px; top: 492px; height: 230px; }
  #row-apps .caption { top: 186px; }

  /* The Next up card can be picked: down to the dock, right of the gear. */
  .card.next { transition: transform 0.3s var(--settle); }
  body.in-dock .card.focused { transform: scale(1.02); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2), 0 0 0 3px rgba(255,255,255,0.95), var(--lift-2); }
  body.in-dock .card.focused.pressed { transform: scale(1.0); }

  /* ---------- routes: the trains around your event ---------- */
  .routes { position: fixed; top: 48px; right: 112px; bottom: 48px; width: 1000px; z-index: 5; border-radius: 30px; padding: 30px 36px 24px;
            --glass-fill: rgba(18, 18, 18, 0.56); display: flex; flex-direction: column; gap: 18px;
            opacity: 0; visibility: hidden; transform: translateX(40px) scale(0.98);
            transition: opacity 0.3s ease, transform 0.5s var(--settle), visibility 0s linear 0.5s; }
  body.routes-open .routes { opacity: 1; visibility: visible; transform: none; transition: opacity 0.3s ease, transform 0.5s var(--settle), visibility 0s; }
  .routes .r-label { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .routes .r-title { font-size: 38px; font-weight: 500; letter-spacing: -0.015em; }
  .routes .r-sub { font-size: 22px; color: var(--muted); margin-top: -8px; }
  .routes .list { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
  .opt { display: grid; grid-template-columns: 250px 1fr 170px; align-items: center; gap: 22px; padding: 14px 24px; border-radius: 20px;
         background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); transition: transform 0.25s var(--settle); }
  .opt.sel { transform: scale(1.015); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2), 0 0 0 3px rgba(255,255,255,0.95), var(--lift-2); background: rgba(255,255,255,0.1); }
  .opt .times { font: 400 34px var(--mono, 'Iosevka'), monospace; font-family: 'Iosevka', monospace; letter-spacing: -0.02em; white-space: nowrap; }
  .opt .times span { color: var(--muted); }
  .opt .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 20px; color: var(--muted); }
  .opt .chip { font-family: 'Iosevka', monospace; font-weight: 500; font-size: 19px; padding: 3px 9px; border-radius: 8px; background: rgba(255,255,255,0.92); color: #111; }
  .opt .chip.walk { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.35); font-weight: 400; }
  .opt .sep { opacity: 0.5; }
  .opt .meta { text-align: right; font-size: 20px; color: var(--muted); line-height: 1.35; }
  .opt .meta b { display: block; color: var(--text); font-weight: 500; font-size: 24px; }
  .opt.late .times, .opt .late { color: var(--warn); }
  .opt .best { display: inline-block; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: #111; background: #fff; border-radius: 6px; padding: 2px 7px; margin-top: 6px; }
  .routes .r-foot { display: flex; justify-content: space-between; font-size: 20px; color: var(--muted); }
  .routes .r-foot .ok { color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .track, .tile, .gear, .caption, .about, .stage .pic { transition-duration: 0.01s !important; }
    .card { animation: none; } .tile::after { display: none; }
  }
</style>
<script>
  /* The page is drawn at 1920×1080. Android TV hands the page its screen in
     its own units (960×540 on the A1), so the whole page is zoomed to fit.
     The app calls __fit(width, height) with the exact size once the page has
     loaded; until then the page measures for itself, a few times, because a
     TV's WebView can report 0 before its first layout. */
  (function () {
    var root = document.documentElement;
    function fit(w, h) {
      w = w || window.innerWidth || root.clientWidth || (window.screen && screen.width) || 0;
      h = h || window.innerHeight || root.clientHeight || (window.screen && screen.height) || 0;
      if (!w || !h) return;
      var s = Math.min(w / 1920, h / 1080);
      root.style.zoom = Math.abs(s - 1) > 0.01 ? String(s) : '';
    }
    var given = null;
    window.__fit = function (w, h) { given = [w, h]; fit(w, h); };
    var again = function () { if (given) fit(given[0], given[1]); else fit(); };
    again();
    window.addEventListener('resize', again);
    document.addEventListener('DOMContentLoaded', again);
    window.addEventListener('load', again);
    var tries = 0, t = setInterval(function () { again(); if (++tries > 10) clearInterval(t); }, 300);
  })();
</script>
</head>
<body class="plain">
<div class="bg" aria-hidden="true"></div>
<div class="stage" aria-hidden="true"><img class="pic" id="picA" alt=""><img class="pic" id="picB" alt=""></div>
<div class="shade" aria-hidden="true"></div>

<div class="routes glass" id="routes" aria-hidden="true">
  <div><div class="r-label" id="rLabel"></div><div class="r-title" id="rTitle"></div></div>
  <div class="r-sub" id="rSub"></div>
  <div class="list" id="rList"></div>
  <div class="r-foot"><span id="rHint"></span><span id="rStatus"></span></div>
</div>

<div class="page">
  <div class="about" id="about"><div class="about-label" id="aboutLabel"></div><div class="about-title" id="aboutTitle"></div><div class="about-meta" id="aboutMeta"></div></div>

  <section class="row" id="row-apps">
    <div class="viewport"><div class="track"></div></div>
    <div class="caption"></div>
  </section>

  <div class="dock">
    <div class="when">
      <div class="clock" id="clock" aria-label="Time"></div>
      <div class="date" id="date"></div>
      <div class="row" id="row-dock"><div class="status"><span id="status"></span><span class="gear glass" id="gear" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span></div></div>
    </div>
    <div class="now" id="now" aria-label="Now"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================= what goes on the home screen =================
     The only row, in this order. Apps are found by package first, then by
     the name the TV shows; ones that aren't installed are simply left out.
     `shelf` is whose popular titles fill the screen while you're on it;
     `music` shows what's playing instead. Everything else shows your photos. */
  var PINNED = [
    {hdmi: 3, label: 'Apple TV', shelf: 'apple', shelfName: 'Apple TV+'},     // the Apple TV, on HDMI 3
    {label: 'Jellyfin', pkgs: ['org.jellyfin.androidtv'], names: ['jellyfin']},
    {label: 'Tidal', pkgs: ['com.aspiro.tidal'], names: ['tidal'], music: true},
    {label: 'Crunchyroll', pkgs: ['com.crunchyroll.crunchyroid'], names: ['crunchyroll'], shelf: 'crunchyroll'},
    {label: 'Netflix', pkgs: ['com.netflix.ninja'], names: ['netflix'], shelf: 'netflix'},
    {label: 'Disney+', pkgs: ['com.disney.disneyplus'], names: ['disney+', 'disney plus'], shelf: 'disney'},
    {label: 'Prime Video', pkgs: ['com.amazon.amazonvideo.livingroom'], names: ['prime video', 'amazon prime video'], shelf: 'prime'},
    {label: 'HBO Max', pkgs: ['com.wbd.hbomax', 'com.wbd.stream', 'com.hbo.hbonow'], names: ['hbo max', 'max'], shelf: 'hbo'}
  ];

  var params = new URLSearchParams(location.search);
  var API = (params.get('api') || '').replace(/\/$/, '');
  var TOKEN = params.get('token') || '';
  var bridge = window.TVBridge || null;
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (params.get('lite') === '1') document.documentElement.classList.add('lite');

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(d) { d = new Date(d); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  /* ================= clock ================= */
  var digits = [];
  function tick() {
    var now = new Date();
    var text = hhmm(now);
    var clock = $('clock');
    if (!digits.length) {
      for (var i = 0; i < text.length; i++) { var s = el('span', null, text[i]); clock.appendChild(s); digits.push(s); }
    } else {
      for (var j = 0; j < text.length; j++) {
        if (digits[j].textContent === text[j]) continue;
        digits[j].textContent = text[j];
        if (!REDUCED && digits[j].animate) digits[j].animate([{opacity: 0, transform: 'translateY(0.1em)'}, {opacity: 1, transform: 'none'}], {duration: 700, easing: 'cubic-bezier(0.22, 1, 0.36, 1)'});
      }
    }
    $('date').textContent = now.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
  }

  /* ================= rows and focus =================
     The apps, and below them the gear. Left/right moves along the row,
     sliding it so the focused tile always stays in view; down reaches the gear. */
  var rows = [];
  var current = 0;

  function makeRow(id, kind, items) {
    var section = $(id);
    var track = section.querySelector('.track');
    track.textContent = '';
    items.forEach(function (it) { track.appendChild(it.node); });
    return {el: section, kind: kind, track: track, items: items, index: 0, caption: section.querySelector('.caption')};
  }

  function appTile(app) {
    var node = el('div', 'tile' + (app.banner ? ' banner' : ' glass'));
    if (app.banner) node.style.backgroundImage = 'url("' + app.banner + '")';
    node.appendChild(el('div', 'name', app.label));
    return {node: node, label: app.label, banner: app.banner, action: {type: 'app', pkg: app.pkg}};
  }

  /* A device on an HDMI input, shown by its own name ("Apple TV") with the
     port above it so it's clear what it switches to. */
  function hdmiTile(n, label, action) {
    var node = el('div', 'tile text glass');
    node.appendChild(el('div', 'port', 'HDMI ' + n));
    node.appendChild(el('div', 'name', label));
    return {node: node, label: label, action: action || {type: 'hdmi', n: n, name: label}};
  }


  /* Down from the apps: the gear at the end of the date line. */
  var gearItem = {node: $('gear'), label: 'Settings', action: {type: 'settings'}};
  function dockRow() { return {el: $('row-dock'), kind: 'dock', track: null, items: [gearItem], index: 0, caption: null}; }

  function buildRows(apps, inputs) {
    var used = {};
    var pinned = [];
    var pinnedPorts = PINNED.filter(function (p) { return p.hdmi; }).map(function (p) { return p.hdmi; });
    PINNED.forEach(function (p, i) {
      if (p.hdmi) {
        var tile = hdmiTile(p.hdmi, p.label);
        tile.shelf = p.shelf; tile.shelfName = p.shelfName;
        pinned.push(tile);
        // Right after the pinned device: whatever else is plugged in and on,
        // named after the device itself. Nothing connected, no tile.
        if (i === 0) inputs.forEach(function (inp) {
          if (pinnedPorts.indexOf(inp.number) >= 0) return;
          pinned.push(hdmiTile(inp.number, inp.name, {type: 'input', id: inp.id}));
        });
        return;
      }
      var app = apps.filter(function (a) { return p.pkgs.indexOf(a.pkg) >= 0; })[0] ||
        apps.filter(function (a) { return p.names.indexOf(a.label.toLowerCase()) >= 0; })[0];
      if (app && !used[app.pkg]) {
        used[app.pkg] = true;
        var t = appTile(app);
        t.shelf = p.shelf; t.shelfName = p.label; t.music = p.music;
        pinned.push(t);
      }
    });

    var keep = rows.map(function (r) { return r.index; });
    var wasKind = rows[current] && rows[current].kind;
    rows = [makeRow('row-apps', 'apps', pinned), dockRow()].filter(function (r) { return r.items.length; });
    rows.forEach(function (r, i) { r.index = Math.min(keep[i] || 0, r.items.length - 1); });
    var again = rows.map(function (r) { return r.kind; }).indexOf(wasKind || 'apps');
    current = again >= 0 ? again : 0;
    paint(true);
  }

  function paint(instant) {
    document.body.classList.toggle('in-dock', !!(rows[current] && rows[current].kind === 'dock'));
    rows.forEach(function (r, ri) {
      r.el.classList.toggle('active', ri === current);
      r.items.forEach(function (it, i) { it.node.classList.toggle('focused', i === r.index); });
      if (r.caption) r.caption.textContent = r.items[r.index] ? r.items[r.index].label : '';
      slide(r, instant);
    });
    stageForFocus();
  }

  /* Keep the focused tile inside the screen with a margin, moving the row only
     as far as needed. The transition starts from wherever the row is now, so
     holding the button down just keeps it gliding. */
  function slide(r, instant) {
    if (!r.track) return;
    var node = r.items[r.index] && r.items[r.index].node;
    if (!node) return;
    var view = 1920 - 2 * 112;
    var left = node.offsetLeft;
    var right = left + node.offsetWidth;
    var x = r.offset || 0;
    if (right + x > view - 60) x = view - 60 - right;
    if (left + x < 0) x = -left;
    x = Math.min(0, x);
    r.offset = x;
    var moves = [r.track].concat(r.caption ? [r.caption] : []);
    if (instant) moves.forEach(function (m) { m.style.transition = 'none'; });
    r.track.style.transform = 'translateX(' + x + 'px)';
    if (r.caption) r.caption.style.transform = 'translateX(' + (left + x) + 'px)';
    if (instant) { r.track.getBoundingClientRect(); moves.forEach(function (m) { m.style.transition = ''; }); }
  }

  function move(dRow, dCol) {
    if (!rows.length) return;
    if (dRow) current = Math.max(0, Math.min(rows.length - 1, current + dRow));
    if (dCol) { var r = rows[current]; r.index = Math.max(0, Math.min(r.items.length - 1, r.index + dCol)); }
    paint(false);
  }

  function activate() {
    var r = rows[current];
    var it = r && r.items[r.index];
    if (!it || !bridge) return;
    var a = it.action;
    if (a.type === 'app') bridge.launch(a.pkg);
    else if (a.type === 'hdmi') bridge.hdmi(a.n, a.name || '');
    else if (a.type === 'input') bridge.openInput(a.id);
    else if (a.type === 'settings') bridge.openSettings();
    else if (a.type === 'routes') openRoutes();
  }

  /* The dock row: the gear, and the Next up card once it has a route. */
  function dockItems() {
    var card = $('nextCard');
    var n = feed && feed.nextUp, t = n && n.trip;
    var items = [gearItem];
    if (card && t && t.options && t.options.length) items.push({node: card, label: 'Routes', action: {type: 'routes'}});
    rows.forEach(function (r) {
      if (r.kind !== 'dock') return;
      r.items = items;
      r.index = Math.min(r.index, items.length - 1);
    });
    paint(false);
  }

  var pressed = null;
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (routesOpen) {
      if (k === 38) { pickRoute(-1); e.preventDefault(); }
      else if (k === 40) { pickRoute(1); e.preventDefault(); }
      else if (k === 37 || k === 27) { closeRoutes(); e.preventDefault(); }
      else if ((k === 13 || k === 23) && !e.repeat) { routeKeyDown = true; e.preventDefault(); }
      return;
    }
    if (k === 37) { move(0, -1); e.preventDefault(); }
    else if (k === 39) { move(0, 1); e.preventDefault(); }
    else if (k === 38) { move(-1, 0); e.preventDefault(); }
    else if (k === 40) { move(1, 0); e.preventDefault(); }
    else if ((k === 13 || k === 23) && !e.repeat) {
      var r = rows[current];
      pressed = r && r.items[r.index] && r.items[r.index].node;
      if (pressed) pressed.classList.add('pressed');   // feedback on press, not on release
      e.preventDefault();
    }
  });
  document.addEventListener('keyup', function (e) {
    if (routesOpen) {
      if ((e.keyCode === 13 || e.keyCode === 23) && routeKeyDown) { routeKeyDown = false; sendRoute(); }
      return;
    }
    if ((e.keyCode === 13 || e.keyCode === 23) && pressed) {
      pressed.classList.remove('pressed');
      pressed = null;
      activate();
    }
  });

  window.goHome = function () {
    var apps = rows.map(function (r) { return r.kind; }).indexOf('apps');
    current = apps >= 0 ? apps : 0;
    rows.forEach(function (r) { r.index = 0; });
    paint(false);
  };

  /* ================= apps from the TV ================= */
  var lastApps = '';
  function loadApps() {
    var raw = bridge ? bridge.apps() : '';
    if (!raw) { setTimeout(loadApps, 300); return; }   // banners are still being prepared
    var inputs = '[]';
    try { inputs = (bridge.inputs && bridge.inputs()) || '[]'; } catch (e) { inputs = '[]'; }
    if (raw + inputs === lastApps) return;
    lastApps = raw + inputs;
    try { buildRows(JSON.parse(raw), JSON.parse(inputs)); } catch (e) { /* keep the last rows */ }
  }

  /* ================= the stage =================
     The whole background follows the focused tile, once the remote rests on
     it: a streaming app shows what's popular there (TMDB, via /api/trending),
     Tidal shows the album that's playing, and everything else your photos.
     Each source cycles slowly; a picture only swaps in once it has loaded. */
  var trending = {};
  function loadTrending() {
    if (!API) return;
    fetch(API + '/api/trending?token=' + encodeURIComponent(TOKEN))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.services) { trending = d.services; stageForFocus(); }
        console.log('[stage] trending', d ? Object.keys(d.services || {}).length + ' services' : 'no answer');
      })
      .catch(function (e) { console.warn('[stage] trending failed', e); });
  }

  var photos = [], photoIndex = 0;
  function loadPhotos() {
    if (!API) return;
    fetch(API + '/api/photos?token=' + encodeURIComponent(TOKEN))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.photos || !d.photos.length) { console.warn('[stage] no photos', d && d.error); return; }
        photos = d.photos.slice().sort(function () { return Math.random() - 0.5; });
        console.log('[stage] photos', photos.length);
        stageForFocus();
      })
      .catch(function (e) { console.warn('[stage] photos failed', e); });
  }

  function playing() {
    try { var raw = bridge && bridge.nowPlaying(); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }

  /* What the stage should show for a tile: a key (same key, keep going) and a
     way to get the next picture. */
  function sourceFor(it) {
    if (it && it.shelf && trending[it.shelf] && trending[it.shelf].length) {
      var list = trending[it.shelf];
      return {key: 'svc:' + it.shelf, next: function (i) {
        var t = list[i % list.length];
        return {src: t.original ? API + '/_vercel/image?url=' + encodeURIComponent(t.original) + '&w=1920&q=82' : t.backdrop, fallback: t.backdrop, label: 'Popular on ' + (it.shelfName || it.label), title: t.title,
                meta: [t.kind === 'film' ? 'Film' : 'Series', t.year].filter(Boolean).join(' · ')};
      }};
    }
    var music = it && it.music ? playing() : null;
    if (music && music.title && music.art) {
      return {key: 'music:' + music.title, still: true, next: function () {
        return {src: music.art, soft: true, label: 'Now playing', title: music.title, meta: music.artist || ''};
      }};
    }
    // Nothing of its own to show: your photos, the same ones as the screensaver.
    if (photos.length) {
      return {key: 'photos', next: function () {
        var ph = photos[photoIndex++ % photos.length];
        return {src: ph.url, label: '', title: '', meta: ''};
      }};
    }
    return null;   // no photos (yet): plain black
  }

  var stageKey = null, stageStep = 0, stageTimer = null, stageCycle = null;
  var picFront = $('picA'), picBack = $('picB');
  function stageForFocus() {
    clearTimeout(stageTimer);
    var r = rows[current];
    var it = r && r.kind === 'apps' ? r.items[r.index] : (rows[0] && rows[0].items[rows[0].index]);
    var source = sourceFor(it);
    var key = source ? source.key : null;
    if (key === stageKey) return;
    // Wait until the remote rests: holding right doesn't flash every app past.
    stageTimer = setTimeout(function () {
      stageKey = key;
      stageStep = 0;
      clearInterval(stageCycle);
      if (!source) { showPicture(null); return; }
      showPicture(source.next(stageStep));
      if (!source.still) stageCycle = setInterval(function () { stageStep++; showPicture(source.next(stageStep)); }, 9000);
    }, stageKey === null ? 0 : 450);
  }

  function showPicture(pic) {
    var about = $('about');
    if (!pic) {
      about.classList.add('swap');
      picFront.classList.remove('on');
      document.body.classList.add('plain');
      return;
    }
    var key = stageKey;
    var img = new Image();
    var ready = function () {
      if (key !== stageKey) return;            // focus moved on while it loaded
      about.classList.add('swap');
      setTimeout(function () {
        $('aboutLabel').textContent = pic.label;
        $('aboutTitle').textContent = pic.title;
        $('aboutMeta').textContent = pic.meta;
        if (pic.label || pic.title) about.classList.remove('swap');
      }, 420);
      picBack.classList.remove('on');
      picBack.classList.toggle('soft', !!pic.soft);
      picBack.src = pic.src;
      picBack.getBoundingClientRect();
      picBack.classList.add('on');
      picFront.classList.remove('on');
      document.body.classList.remove('plain');
      var t = picFront; picFront = picBack; picBack = t;
    };
    var shown = false;
    var show = function () { if (shown) return; shown = true; ready(); };
    img.onload = function () {
      // Decode off the main thread first so the crossfade starts smooth, but
      // never wait on it for long: some TV WebViews never settle decode().
      if (img.decode) img.decode().then(show, show);
      setTimeout(show, 800);
    };
    img.onerror = function () {
      console.warn('[stage] picture failed', img.src);
      if (pic.fallback && img.src.indexOf(pic.fallback) < 0) { pic.src = pic.fallback; img.src = pic.fallback; }
    };
    img.src = pic.src;
  }

  /* ================= cards: next up, music, parcels ================= */
  var feed = null;
  function loadFeed() {
    if (!API) return;
    fetch(API + '/api/feed?token=' + encodeURIComponent(TOKEN))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) { feed = d; renderNow(); renderStatus(); } })
      .catch(function () {});
  }

  function renderStatus() {
    var w = feed && feed.weather;
    var parts = [];
    if (w && w.configured && !w.error) {
      if (w.temperature != null) parts.push(w.temperature + '°');
      if (w.rain) parts.push(w.rain.text);
    }
    $('status').textContent = parts.join(' · ');
  }

  var lastNow = '';
  function renderNow() {
    var box = $('now');
    var music = null;
    try { var raw = bridge && bridge.nowPlaying(); music = raw ? JSON.parse(raw) : null; } catch (e) { music = null; }
    var n = feed && feed.nextUp;
    var parcels = (feed && feed.packages && feed.packages.items) || [];
    var key = JSON.stringify([n && n.event, n && n.trip && n.trip.leaveAt, n && n.trip && n.trip.disrupted, n && n.trip && (n.trip.options || []).map(function (o) { return o.leaveAt + o.disrupted; }), music && [music.title, music.artist], parcels]);
    if (key === lastNow) return;       // nothing changed: no rebuild, no flicker
    if (lastNow) stageForFocus();      // a new song: Tidal's backdrop follows
    lastNow = key;
    box.textContent = '';

    if (n && n.event && n.mode !== 'none') {
      var c = el('div', 'card glass next');
      c.id = 'nextCard';
      var head = el('div', 'head');
      head.appendChild(el('span', null, n.mode === 'preview' ? 'Tomorrow' : 'Next up'));
      head.appendChild(el('span', 'mono', hhmm(n.event.start) + '–' + hhmm(n.event.end)));
      c.appendChild(head);
      c.appendChild(el('div', 'title', n.event.title));
      if (n.event.location) c.appendChild(el('div', 'sub', n.event.location));
      var t = n.trip;
      if (t && t.error) c.appendChild(el('div', 'sub', 'No route yet: the address couldn\u2019t be found'));
      if (t && t.configured && !t.error && t.leaveAt) {
        var leave = el('div', 'leave' + (t.disrupted ? ' late' : ''));
        leave.appendChild(el('b', null, 'Leave ' + hhmm(t.leaveAt)));
        var ride = (t.legs || []).filter(function (l) { return l.mode === 'transit'; })[0];
        var bits = [t.durationMinutes + ' min'];
        if (ride) bits.unshift((ride.line || '') + ' ' + (ride.departure ? hhmm(ride.departure) : '') + (ride.platform ? ' · Spoor ' + ride.platform : ''));
        var rest = el('span', 'sub', bits.join(' · '));
        if (ride && ride.delayMinutes > 0) { rest.appendChild(document.createTextNode(' ')); rest.appendChild(el('span', 'warn', '+' + ride.delayMinutes)); }
        leave.appendChild(rest);
        c.appendChild(leave);
      }
      box.appendChild(c);
    }

    if (music || parcels.length) {
      var f = el('div', 'card glass');
      if (music) {
        var m = el('div', 'media');
        var art = el('div', 'art');
        if (music.art) art.style.backgroundImage = 'url("' + music.art + '")';
        m.appendChild(art);
        var info = el('div');
        info.appendChild(el('div', 'title', music.title || ''));
        info.appendChild(el('div', 'sub', [music.artist, music.app].filter(Boolean).join(' · ')));
        m.appendChild(info);
        f.appendChild(m);
      }
      parcels.forEach(function (p) {
        var row = el('div', 'parcel');
        var top = el('div', 'head');
        top.appendChild(el('span', null, p.carrier + (p.for ? ' · for ' + p.for : '') + ' · ' + p.status));
        if (p.window) top.appendChild(el('span', 'mono', p.window));
        row.appendChild(top);
        var steps = el('div', 'steps');
        for (var i = 0; i < 3; i++) steps.appendChild(el('i', i < (p.step || 0) ? 'done' : ''));
        row.appendChild(steps);
        f.appendChild(row);
      });
      box.appendChild(f);
    }
    dockItems();
    if (routesOpen) renderRoutes();
  }

  /* ================= routes =================
     OK on the Next up card: the departures around your event, up and down to
     pick one, OK sends it to your phone (ntfy), Back closes. */
  var routesOpen = false, routeKeyDown = false, routeSel = 0, routeOptions = [];

  function rideLabel(l) {
    var line = String(l.line || '').trim();
    var v = String(l.vehicle || '').toLowerCase();
    if (/sprinter/i.test(line)) return 'SPR';
    if (/intercity direct/i.test(line)) return 'ICD';
    if (/intercity/i.test(line)) return 'IC';
    if (v === 'subway' || v === 'metro') return 'M' + line.replace(/^metro\s*/i, '');
    if (v === 'bus' && /^\d/.test(line)) return 'Bus ' + line;
    if (v === 'tram' && /^\d/.test(line)) return 'Tram ' + line;
    return line || (v ? v[0].toUpperCase() + v.slice(1) : 'Ride');
  }
  function duration(min) { return min >= 60 ? Math.floor(min / 60) + ' h ' + pad(min % 60) : min + ' min'; }

  function openRoutes() {
    var t = feed && feed.nextUp && feed.nextUp.trip;
    if (!t || !t.options || !t.options.length) return;
    routesOpen = true;
    routeSel = Math.max(0, t.options.map(function (o) { return o.best; }).indexOf(true));
    renderRoutes();
    document.body.classList.add('routes-open');
    $('routes').setAttribute('aria-hidden', 'false');
  }
  function closeRoutes() {
    routesOpen = false;
    document.body.classList.remove('routes-open');
    $('routes').setAttribute('aria-hidden', 'true');
    $('rStatus').textContent = '';
  }
  window.onBack = function () { if (routesOpen) { closeRoutes(); return true; } return false; };

  function pickRoute(d) {
    routeSel = Math.max(0, Math.min(routeOptions.length - 1, routeSel + d));
    Array.prototype.forEach.call($('rList').children, function (row, i) { row.classList.toggle('sel', i === routeSel); });
    $('rStatus').textContent = '';
  }

  function renderRoutes() {
    var n = feed && feed.nextUp, t = n && n.trip;
    if (!t || !t.options) { closeRoutes(); return; }
    var keep = routeOptions[routeSel] && routeOptions[routeSel].leaveAt;
    routeOptions = t.options;
    var again = routeOptions.map(function (o) { return o.leaveAt; }).indexOf(keep);
    if (again >= 0) routeSel = again;
    routeSel = Math.min(routeSel, routeOptions.length - 1);

    $('rLabel').textContent = (n.mode === 'preview' ? 'Tomorrow' : 'Today') + ' · ' + n.event.title;
    $('rTitle').textContent = n.event.location || (t.to && t.to.label) || 'Routes';
    $('rSub').textContent = 'Starts ' + hhmm(n.event.start) + (t.arriveBy && hhmm(t.arriveBy) !== hhmm(n.event.start) ? ' · arrive by ' + hhmm(t.arriveBy) : '');
    var push = feed.phone && feed.phone.push;
    $('rHint').textContent = push ? '\u2191\u2193 pick a departure · OK sends it to your phone' : 'Set NTFY_TOPIC in Vercel to send routes to your phone';

    var list = $('rList');
    list.textContent = '';
    routeOptions.forEach(function (o, i) {
      var row = el('div', 'opt' + (i === routeSel ? ' sel' : '') + (o.disrupted ? ' late' : ''));
      var times = el('div', 'times');
      times.appendChild(document.createTextNode(hhmm(o.leaveAt) + ' '));
      times.appendChild(el('span', null, '\u2192 ' + hhmm(o.arriveAt)));
      row.appendChild(times);
      var chips = el('div', 'chips');
      (o.legs || []).forEach(function (l, j) {
        if (j) chips.appendChild(el('span', 'sep', '\u203A'));
        if (l.mode === 'walk') chips.appendChild(el('span', 'chip walk', 'walk ' + l.minutes));
        else {
          chips.appendChild(el('span', 'chip', rideLabel(l)));
          var extra = [l.departure ? hhmm(l.departure) : null, l.platform ? 'sp ' + l.platform : null].filter(Boolean).join(' ');
          if (extra) chips.appendChild(el('span', null, extra));
          if (l.delayMinutes > 0) chips.appendChild(el('span', 'late', '+' + l.delayMinutes));
          if (l.cancelled) chips.appendChild(el('span', 'late', 'cancelled'));
        }
      });
      row.appendChild(chips);
      var meta = el('div', 'meta');
      meta.appendChild(el('b', null, duration(o.durationMinutes)));
      meta.appendChild(document.createTextNode(o.transfers ? o.transfers + (o.transfers === 1 ? ' transfer' : ' transfers') : 'direct'));
      if (o.best) { meta.appendChild(document.createElement('br')); meta.appendChild(el('span', 'best', 'Best')); }
      row.appendChild(meta);
      list.appendChild(row);
    });
  }

  /* The route, compact, in the link's # so it never reaches a server. */
  function tripLink(n, t, o) {
    var payload = {
      e: n.event.title, s: n.event.start, loc: n.event.location || (t.to && t.to.label) || null,
      f: t.from ? [t.from.lat, t.from.lng] : null, t: t.to ? [t.to.lat, t.to.lng] : null,
      o: {l: o.leaveAt, a: o.arriveAt, d: o.durationMinutes, x: o.transfers || 0, legs: (o.legs || []).map(function (l) {
        if (l.mode === 'walk') return {w: l.minutes, to: l.to || null};
        return {v: l.vehicle || null, n: rideLabel(l), h: l.headsign || null, f: l.from || null, t: l.to || null,
                d: l.departure || null, a: l.arrival || null, p: l.platform || null, dl: l.delayMinutes || 0, c: !!l.cancelled};
      })}
    };
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return API + '/trip/#' + b64;
  }

  function sendRoute() {
    var n = feed && feed.nextUp, t = n && n.trip, o = routeOptions[routeSel];
    if (!o) return;
    if (!(feed.phone && feed.phone.push)) { $('rStatus').textContent = 'Not set up yet'; return; }
    var first = (o.legs || []).filter(function (l) { return l.mode !== 'walk'; })[0];
    var title = 'Leave ' + hhmm(o.leaveAt) + ' \u2192 ' + (n.event.location || n.event.title);
    var message = [first ? rideLabel(first) + ' ' + hhmm(first.departure) + (first.from ? ' from ' + first.from : '') + (first.platform ? ', spoor ' + first.platform : '') : null,
                   'arrive ' + hhmm(o.arriveAt) + ' · ' + duration(o.durationMinutes),
                   n.event.title + ' starts ' + hhmm(n.event.start)].filter(Boolean).join('\n');
    $('rStatus').className = '';
    $('rStatus').textContent = 'Sending…';
    fetch(API + '/api/send?token=' + encodeURIComponent(TOKEN), {
      method: 'POST', headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({title: title, message: message, url: tripLink(n, t, o)})
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return {ok: r.ok, d: d}; }); })
      .then(function (x) {
        $('rStatus').className = 'ok';
        $('rStatus').textContent = x.ok && x.d.sent ? 'Sent to your phone \u2713' : 'Couldn\u2019t send: ' + (x.d.error || 'not set up');
      })
      .catch(function () { $('rStatus').textContent = 'Couldn\u2019t reach the server'; });
  }

  window.onLauncherResume = function () { loadApps(); loadFeed(); };

  /* ================= start ================= */
  tick(); setInterval(tick, 1000);
  loadApps(); setInterval(loadApps, 10000);   // picks up installs and removals
  loadFeed(); setInterval(loadFeed, 90000);
  loadTrending(); setInterval(loadTrending, 3 * 3600 * 1000);
  loadPhotos(); setInterval(loadPhotos, 3600 * 1000);
  setInterval(renderNow, 3000);
